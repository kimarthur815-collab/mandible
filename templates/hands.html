<!DOCTYPE html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MANDIBLE — 1인칭 손</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #ece6dc; --dim: rgba(236,230,220,.55); --line: rgba(236,230,220,.18); --amber: #e7b46a; --blue: #4f7dff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink); font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif; touch-action: none; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #title { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left)); pointer-events: none; }
  #title .logo { font-family: 'Oswald', Impact, sans-serif; font-weight: 600; letter-spacing: .4em; font-size: 15px; }
  #title .sub { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .panel { position: fixed; display: flex; gap: 6px; }
  #side { top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); flex-direction: column; align-items: flex-end; }
  #side .grp { display: flex; gap: 4px; background: rgba(0,0,0,.42); border: 1px solid var(--line); border-radius: 10px; padding: 4px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #side .lab { font-size: 10px; color: var(--dim); margin: 6px 4px 2px 0; letter-spacing: .05em; }
  #poses { left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); padding: 0 calc(12px + env(safe-area-inset-left)); overflow-x: auto; scrollbar-width: none; justify-content: safe center; }
  #poses::-webkit-scrollbar { display: none; }
  button { font: inherit; color: var(--ink); background: transparent; border: 0; border-radius: 7px; padding: 7px 11px; font-size: 12.5px; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
  button:hover { background: rgba(255,255,255,.08); }
  button.on { background: var(--ink); color: #111; font-weight: 700; }
  #poses button { background: rgba(0,0,0,.45); border: 1px solid var(--line); padding: 9px 13px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #poses button.on { background: var(--ink); color: #111; border-color: var(--ink); }
  #poses button .n { opacity: .5; margin-right: 6px; font-size: 11px; }
  #auto { margin-top: 6px; background: rgba(0,0,0,.42); border: 1px solid var(--line); }
  #auto.on { background: var(--amber); color: #111; border-color: var(--amber); }
  #hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(62px + env(safe-area-inset-bottom)); font-size: 11px; color: var(--dim); pointer-events: none; text-shadow: 0 1px 4px #000; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #000; transition: opacity .5s; z-index: 5; }
  #loading.hide { opacity: 0; pointer-events: none; }
  #loading .t { font-family: 'Oswald', sans-serif; letter-spacing: .4em; font-size: 14px; color: var(--dim); }
  @media (max-height: 420px) { #poses button { padding: 7px 10px; font-size: 11.5px; } button { padding: 6px 9px; font-size: 11.5px; } #hint { bottom: calc(52px + env(safe-area-inset-bottom)); } }
</style>
</head>
<body class="notranslate" translate="no">
<div id="app"></div>
<div id="title"><div class="logo">MANDIBLE</div><div class="sub">1인칭 손 · 방역복 + 니트릴 장갑 + 손전등</div></div>
<div id="side" class="panel">
  <div class="lab">시점</div>
  <div class="grp"><button data-view="game">게임 시점</button><button data-view="studio">스튜디오</button></div>
  <div class="lab">손전등</div>
  <div class="grp"><button data-level="off">끄기</button><button data-level="low">약하게</button><button data-level="mid">보통</button><button data-level="high">강하게</button></div>
  <button id="auto">자동 넘기기</button>
</div>
<div id="poses" class="panel">
  <button data-pose="default"><span class="n">1</span>기본</button>
  <button data-pose="up"><span class="n">2</span>위로 비추기</button>
  <button data-pose="down"><span class="n">3</span>아래로 비추기</button>
  <button data-pose="use"><span class="n">4</span>왼손 사용</button>
  <button data-pose="both"><span class="n">5</span>양손 잡기</button>
  <button data-pose="off"><span class="n">6</span>손전등 끄기</button>
  <button data-pose="fist"><span class="n">7</span>왼손 주먹</button>
  <button data-pose="spray"><span class="n">8</span>스프레이</button>
</div>
<div id="hint">드래그해서 둘러보기 · 스튜디오에서는 돌려보기/확대</div>
<div id="loading"><div class="t">LOADING</div></div>
<script>window.__TEST = /[?&]test/.test(location.search);</script>
<script>/*__APP__*/</script>
</body>
</html>
