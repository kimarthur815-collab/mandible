<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MANDIBLE — 어려움: 사람과 합쳐진 벌레</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #ece6dc; --dim: rgba(236,230,220,.6); --line: rgba(236,230,220,.14); --amber: #e7b46a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink);
    font-family: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; touch-action: none; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; z-index: 5; }
  .brand { top: calc(14px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left)); pointer-events: none; }
  .brand .logo { font-family: 'Oswald', Impact, sans-serif; font-weight: 600; font-size: 18px; letter-spacing: .42em; }
  .brand .sub { margin-top: 3px; font-size: 12px; color: var(--dim); }
  #desc { top: calc(14px + env(safe-area-inset-top)); right: calc(16px + env(safe-area-inset-right)); max-width: min(420px, 52vw);
    font-size: 12.5px; line-height: 1.55; color: rgba(255,255,255,.86); text-shadow: 0 1px 6px #000; text-align: right; pointer-events: none; }
  #desc b { color: var(--amber); }
  .bar { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 6px; padding: 6px;
    border-radius: 14px; background: rgba(12,11,10,.66); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    max-width: calc(100% - 16px); flex-wrap: wrap; justify-content: center; }
  .seg { display: flex; background: rgba(255,255,255,.05); border-radius: 10px; padding: 2px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; font-size: 13px; font-weight: 500; color: var(--ink); background: transparent; border: 0; padding: 9px 12px;
    border-radius: 9px; cursor: pointer; white-space: nowrap; min-height: 40px; }
  button.on { background: rgba(231,180,106,.18); color: var(--amber); }
  #loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; background: #030303; transition: opacity .8s; z-index: 10; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .t { font-family: 'Oswald', Impact, sans-serif; font-size: 28px; letter-spacing: .5em; margin-left: .5em; }
  #loading .msg { margin-top: 12px; font-size: 12px; color: var(--dim); }
  @media (max-width: 700px), (max-height: 460px) {
    button { font-size: 12px; padding: 7px 8px; min-height: 34px; }
    #desc { font-size: 11px; max-width: 46vw; }
    .brand .logo { font-size: 15px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="ui brand"><div class="logo">MANDIBLE</div><div class="sub">어려움 · 사람과 합쳐진 벌레</div></div>
<div class="ui" id="desc"></div>
<div class="ui bar">
  <div class="seg" id="picks">
