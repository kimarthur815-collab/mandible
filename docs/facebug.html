<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MANDIBLE — 바퀴가 붙었을 때 (후보 3개)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #ece6dc; --dim: rgba(236,230,220,.6); --line: rgba(236,230,220,.14); --amber: #e7b46a; --n: 0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink);
    font-family: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; }
  /* the world behind (sways with your head); everything else is on your face and stays put */
  #stage { position: fixed; inset: 0; will-change: transform; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: filter .4s; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  /* A, C: the edges close in as more of them crawl on you */
  #vig { position: fixed; inset: 0; pointer-events: none; opacity: calc(.35 + var(--n) * .2);
    background: radial-gradient(ellipse at 50% 52%, rgba(0,0,0,0) calc(64% - var(--n) * 7%), rgba(10,4,2,.9) 100%); transition: opacity .4s; }
  body[data-mode="B"] #vig { opacity: calc(.15 + var(--n) * .08); }
  /* C: the hood's brim across the top, where they come from */
  #hood { position: fixed; left: -5%; right: -5%; top: 0; height: 15%; pointer-events: none; display: none;
    background: radial-gradient(ellipse 60% 100% at 50% 0%, rgba(8,9,10,.96) 0%, rgba(8,9,10,.85) 55%, rgba(8,9,10,0) 100%); }
  body[data-mode="C"] #hood { display: block; }
  /* B: the mask */
  #smear { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; filter: blur(.6px); }
  #glass, #visor, #fog { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
  body[data-mode="B"] #smear, body[data-mode="B"] #glass, body[data-mode="B"] #visor, body[data-mode="B"] #fog { display: block; }
  #glass { background: linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(220,235,255,.07) 38%, rgba(255,255,255,0) 46%),
                       linear-gradient(115deg, rgba(255,255,255,0) 52%, rgba(220,235,255,.035) 55%, rgba(255,255,255,0) 58%),
                       radial-gradient(ellipse at 50% 50%, rgba(150,175,190,0) 55%, rgba(150,175,190,.08) 100%); }
  #fog { opacity: 0; background: radial-gradient(ellipse 34% 30% at 50% 96%, rgba(215,222,228,.55), rgba(215,222,228,.25) 45%, rgba(215,222,228,0) 100%);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    -webkit-mask-image: radial-gradient(ellipse 40% 36% at 50% 98%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 40% 36% at 50% 98%, #000 30%, transparent 100%); }
  .ui { position: fixed; z-index: 5; }
  .brand { top: calc(14px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left)); pointer-events: none; }
  .brand .logo { font-family: 'Oswald', Impact, sans-serif; font-weight: 600; font-size: 18px; letter-spacing: .42em; }
  .brand .sub { margin-top: 3px; font-size: 12px; color: var(--dim); }
  #desc { top: calc(14px + env(safe-area-inset-top)); right: calc(16px + env(safe-area-inset-right)); max-width: min(420px, 52vw);
    font-size: 12.5px; line-height: 1.55; color: rgba(255,255,255,.86); text-shadow: 0 1px 6px #000; text-align: right; pointer-events: none; }
  #desc b { color: var(--amber); }
  .bar { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 6px; padding: 6px;
    border-radius: 14px; background: rgba(12,11,10,.66); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    max-width: calc(100% - 16px); flex-wrap: wrap; justify-content: center; }
  .seg { display: flex; background: rgba(255,255,255,.05); border-radius: 10px; padding: 2px; }
  button { font: inherit; font-size: 13px; font-weight: 500; color: var(--ink); background: transparent; border: 0; padding: 9px 12px;
    border-radius: 9px; cursor: pointer; white-space: nowrap; min-height: 40px; }
  button.on { background: rgba(231,180,106,.18); color: var(--amber); }
  #shake { background: rgba(224,90,58,.22); }
  #loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; background: #030303; transition: opacity .8s; z-index: 10; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .t { font-family: 'Oswald', Impact, sans-serif; font-size: 28px; letter-spacing: .5em; margin-left: .5em; }
  #loading .msg { margin-top: 12px; font-size: 12px; color: var(--dim); }
  @media (max-width: 700px), (max-height: 460px) {
    button { font-size: 12px; padding: 8px 9px; min-height: 36px; }
    #desc { font-size: 11.5px; max-width: 56vw; }
    .brand .logo { font-size: 15px; }
  }
</style>
</head>
