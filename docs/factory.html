<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MANDIBLE — 공장 외관 프리뷰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #ece6dc; --dim: rgba(236,230,220,.55); --line: rgba(236,230,220,.14); --amber: #e7b46a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #030303; overflow: hidden; color: var(--ink);
    font-family: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .brand { position: fixed; top: calc(18px + env(safe-area-inset-top)); left: calc(20px + env(safe-area-inset-left));
    pointer-events: none; user-select: none; }
  .brand .logo { font-family: 'Oswald', 'Impact', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: .42em; }
  .brand .sub { margin-top: 4px; font-size: 12px; color: var(--dim); letter-spacing: .04em; }
  .bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom));
    display: flex; gap: 6px; padding: 6px; border-radius: 14px; background: rgba(12,11,10,.62);
    border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: calc(100% - 24px); flex-wrap: wrap; justify-content: center; }
  .seg { display: flex; background: rgba(255,255,255,.05); border-radius: 10px; padding: 2px; }
  button { font: inherit; font-size: 13px; font-weight: 500; color: var(--ink); background: transparent; border: 0;
    padding: 10px 13px; border-radius: 9px; cursor: pointer; white-space: nowrap; min-height: 40px; transition: background .2s, color .2s; }
  button:hover { background: rgba(255,255,255,.07); }
  button.on { background: rgba(231,180,106,.16); color: var(--amber); }
  .seg button.on { background: rgba(236,230,220,.14); color: var(--ink); }
  #tip { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom));
    font-size: 13px; color: rgba(255,255,255,.88); text-shadow: 0 1px 6px rgba(0,0,0,.9); letter-spacing: .02em;
    opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  #tip.show { opacity: 1; }
  #hint { position: fixed; top: calc(20px + env(safe-area-inset-top)); right: calc(20px + env(safe-area-inset-right));
    max-width: 320px; text-align: right; font-size: 12px; line-height: 1.6; color: var(--dim); opacity: 0;
    transition: opacity .6s; pointer-events: none; }
  #hint.show { opacity: 1; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .25s; display: grid; place-content: center; z-index: 5; }
  #fade.on { opacity: 1; }
  #fade span { font-size: 14px; color: rgba(255,255,255,.75); letter-spacing: .08em; }
  #loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; background: #030303;
    transition: opacity .8s; z-index: 10; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .t { font-family: 'Oswald', 'Impact', sans-serif; font-size: 30px; letter-spacing: .5em; margin-left: .5em; }
  #loading .msg { margin-top: 12px; font-size: 12px; color: var(--dim); }
  @media (max-width: 560px) {
    .bar { gap: 4px; padding: 5px; bottom: calc(12px + env(safe-area-inset-bottom)); width: calc(100% - 24px); }
    button { font-size: 12px; padding: 9px 9px; min-height: 40px; }
    #hint { display: none; }
    .brand .logo { font-size: 18px; }
    #tip { bottom: calc(118px + env(safe-area-inset-bottom)); }
  }
</style>
</head>

<div id="app"></div>
<div class="brand"><div class="logo">MANDIBLE</div><div class="sub">공장 외관 프리뷰 · D-7 살충제 공장</div></div>
<div id="hint">드래그로 돌려 보고 휠·두 손가락으로 확대하세요.</div>
<div class="bar">

  <div class="seg"><button data-time="dusk" class="on">노을</button><button data-time="night">밤</button></div>
</div>
